<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EucliGeo prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --paper:#F5F8FB; --grid:rgba(36,87,214,.07); --card:#FFFFFF; --ink:#13233F; --ink2:#4A5A74; --line:#D3DDE9;
  --blue:#2457D6; --blue-soft:#E3EBFD; --good:#1E8E5A; --good-soft:#DDF3E8; --bad:#C2413B; --bad-soft:#FBE4E2; --mark:#F2B705; --mark-soft:#FFF3C7;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --fs:17px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#0E1626;--grid:rgba(125,162,255,.08);--card:#16213A;--ink:#E8EEF8;--ink2:#9AA9C2;--line:#2A3858;--blue:#7DA2FF;--blue-soft:#1F2F57;--good:#47C98A;--good-soft:#173A2D;--bad:#FF8A80;--bad-soft:#40201F;--mark:#F5C84B;--mark-soft:#43391A}
}
:root[data-theme="dark"]{--paper:#0E1626;--grid:rgba(125,162,255,.08);--card:#16213A;--ink:#E8EEF8;--ink2:#9AA9C2;--line:#2A3858;--blue:#7DA2FF;--blue-soft:#1F2F57;--good:#47C98A;--good-soft:#173A2D;--bad:#FF8A80;--bad-soft:#40201F;--mark:#F5C84B;--mark-soft:#43391A}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;color:var(--ink);font-family:var(--body);font-size:var(--fs);line-height:1.55}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0}
h1{font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.02em}
h2{font-size:1.6rem;margin-bottom:6px}
h3{font-size:1.08rem;margin-bottom:4px}
p{margin:0 0 10px;max-width:66ch}
a{color:var(--blue)}
button{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.muted{color:var(--ink2);font-size:.9rem}
.center{text-align:center}

/* prototype toolbar */
#proto{position:sticky;top:0;z-index:30;background:var(--ink);color:var(--paper);padding:6px 14px;padding-top:calc(6px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
#proto b{font-family:var(--display)}
#proto button{border:1.5px solid color-mix(in srgb,var(--paper) 45%,transparent);background:transparent;color:var(--paper);border-radius:99px;padding:2px 12px;cursor:pointer;font-size:.85rem}
#proto button[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#1b1500;font-weight:700}
#proto .sp{margin-left:auto}

/* app nav */
#nav{background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:34px;z-index:20}
.navin{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:6px}
.logo{font-family:var(--display);font-weight:700;font-size:1.1rem;padding:12px 10px 12px 0;text-decoration:none;color:var(--ink);white-space:nowrap}
.links{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.links a{padding:13px 11px;text-decoration:none;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap;font-size:.95rem}
.links a[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--mark)}
.acct{display:flex;gap:6px;align-items:center;white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:26px 16px 90px}

/* components */
.btn{display:inline-block;font-family:var(--display);font-weight:700;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:.95rem;cursor:pointer;text-decoration:none;line-height:1.3}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{background:var(--bad)}
.card{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--card);min-width:0}
.card.hi{border-color:var(--blue);background:var(--blue-soft)}
.card.click{cursor:pointer;text-decoration:none;color:inherit;display:block}
.card.click:hover{border-color:var(--blue)}
.pill{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:0 10px;font-size:.8rem;color:var(--ink2);margin:0 4px 4px 0;background:var(--card)}
.pill.ok{border-color:var(--good);color:var(--good)}.pill.warn{border-color:var(--mark);background:var(--mark-soft);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:.9rem;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;text-align:left}
.chip.round{border-radius:99px;padding:4px 13px}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 1px var(--blue)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px}
@media (max-width:820px){.grid2,.grid3,.grid4,.two{grid-template-columns:1fr!important}.grid2.keep{grid-template-columns:1fr 1fr!important}}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:60px}
.meter i{display:block;height:100%;background:var(--blue)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin:14px 0 16px;overflow-x:auto}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--blue)}
.banner{background:var(--mark-soft);border-left:4px solid var(--mark);padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:16px;font-size:.95rem}
.fb{min-height:1.5em;font-size:.93rem;margin:8px 0 0}.fb.good{color:var(--good)}.fb.bad{color:var(--bad)}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],textarea,select{font:inherit;font-size:.95rem;width:100%;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;min-height:130px}
label.f{display:grid;gap:4px;font-size:.9rem;margin-bottom:10px}
input[type=range]{flex:1;accent-color:var(--blue);min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1.5px solid var(--line);vertical-align:middle}
.tbl th{font-family:var(--display);font-size:.88rem}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--blue-soft)}
.scroll{overflow-x:auto}
.empty{text-align:center;padding:30px 10px;color:var(--ink2)}

/* diagrams */
svg.dia{width:100%;height:auto;max-width:370px;display:block;margin:0 auto}
.dia .c{fill:none;stroke:var(--ink);stroke-width:2}
.dia .ln{stroke:var(--ink);stroke-width:2;fill:none}
.dia .lbl{fill:var(--ink);font:700 15px var(--display)}
.dia .ang{fill:var(--mark);fill-opacity:.45;stroke:var(--ink);stroke-width:1}
.dia .hl{opacity:0;stroke:var(--mark);stroke-width:6;fill:none;stroke-linecap:round;transition:opacity .18s}
.dia .hlf{opacity:0;fill:var(--mark);fill-opacity:.6;stroke:none;transition:opacity .18s}
.mini{width:100%;height:auto;max-height:110px;display:block}
.mini .c{fill:none;stroke:var(--ink);stroke-width:2}.mini .ln{stroke:var(--ink);stroke-width:2;fill:none}
.mini .em{stroke:var(--blue);stroke-width:4;fill:none;stroke-linecap:round}.mini .emf{fill:var(--blue);fill-opacity:.3;stroke:var(--blue);stroke-width:3}

/* solver */
.stages{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px}
.stg{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:4px 13px 4px 5px;font-family:var(--display);font-size:.88rem;background:var(--card)}
.stg i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);font:700 .78rem var(--display);font-style:normal}
.stg.cur{border-color:var(--mark);background:var(--mark-soft)}.stg.cur i{background:var(--mark);color:#1b1500}
.stg.done i{background:var(--good);color:#fff}
.task{font-family:var(--display);font-weight:700;font-size:1.1rem;margin-bottom:2px}
.why{font-size:.9rem;color:var(--ink2);margin-bottom:10px}
.subs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.subs{grid-template-columns:1fr 1fr}}
.subc{border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--card);cursor:pointer;text-align:left}
.subc[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 1px var(--blue)}
.subc small{display:block;font-size:.8rem;line-height:1.25;margin-top:4px}
.proof{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
.step{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;padding:9px 10px;border-bottom:1.5px solid var(--line);align-items:center;font-size:.9rem;background:var(--card)}
.step:last-child{border-bottom:0}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 .78rem var(--display);background:var(--line)}
.step.ok{background:var(--good-soft)}.step.ok .n{background:var(--good);color:#fff}
.step.active{box-shadow:inset 4px 0 0 var(--mark)}
.step small{display:block;color:var(--ink2);font-size:.75rem}
.picker{padding:10px 12px;background:var(--mark-soft);border-radius:10px;margin-top:10px}
.picker h4{font:700 .85rem var(--display);margin:4px 0 2px}
.result{background:var(--good-soft);border:1.5px solid var(--good);border-radius:10px;padding:12px 14px;margin-top:12px}
.ctrl{display:grid;gap:10px;margin-top:10px}
.ctrl label{display:flex;align-items:center;gap:10px;font-size:.92rem}
.ctrl label span{min-width:118px}
.readout{font-family:var(--display);background:var(--mark-soft);border-left:4px solid var(--mark);padding:8px 12px;border-radius:0 8px 8px 0;margin-top:12px}
.alg{counter-reset:a;display:grid;gap:10px}
.alg .card{position:relative;padding-left:56px}
.alg .card::before{counter-increment:a;content:counter(a);position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:700 .95rem var(--display)}
.alg .card.ctc{border-color:var(--mark);background:var(--mark-soft)}.alg .card.ctc::before{background:var(--mark);color:#1b1500}
.heat{display:grid;gap:3px;font-size:.8rem;overflow-x:auto}
.heat div{padding:8px 4px;text-align:center;border-radius:4px;color:#10192b;font-weight:700;min-width:44px}
.heat .h{background:none;color:var(--ink2);font-weight:400;font-size:.75rem}
.heat .nm{background:none;color:var(--ink);text-align:left;font-weight:400;cursor:pointer;min-width:80px}
.bars{display:flex;gap:10px;align-items:flex-end;height:130px;margin-top:26px}
.bars div{flex:1;background:var(--blue);border-radius:6px 6px 0 0;position:relative;min-height:6px;transition:height .25s}
.bars div.right{background:var(--good)}
.bars span{position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:.8rem}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--card);border-left:2px solid var(--ink);z-index:50;padding:16px;overflow:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:45}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 28px));background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:18px;z-index:50;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;z-index:80;opacity:0;pointer-events:none;transition:all .22s;max-width:calc(100% - 30px);font-size:.93rem}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;padding:30px 0}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.codebox{font-family:var(--display);font-size:2rem;letter-spacing:.25em;font-weight:700}
.funnel div.r{display:flex;align-items:center;gap:10px;margin:6px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="proto"><b>Prototype</b><span>Viewing as:</span>
  <button data-role="guest" aria-pressed="true">Visitor</button><button data-role="learner" aria-pressed="false">Learner</button><button data-role="teacher" aria-pressed="false">Teacher</button><button data-role="author" aria-pressed="false">Author</button>
  <button class="sp" id="reset">Reset prototype</button></div>
<header id="nav"></header>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="overlay"></div>

<script>
(function(){
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const timers=[];const clearTimers=()=>{while(timers.length)clearInterval(timers.pop())};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------------- data ---------------- */
function freshState(){return{role:'guest',name:'Thandi',
  mastery:{'Angle at the centre':88,'Tangent ⟂ radius':74,'Angles in the same segment':62,'Cyclic quadrilateral':45,'Alternate segment':18,'Isosceles triangle':81,'Angles in a triangle':77},
  stageM:[82,64,48,55],done:{},history:[{t:'Cyclic quadrilateral',date:'10 Mar',st:[1,1,1,1],hints:0,ex:0},{t:'Same segment',date:'8 Mar',st:[1,1,0,0],hints:2,ex:0}],
  assigned:[{t:'Tangents to a circle',due:'Fri',ex:2},{t:'Similar triangles',due:'next week',ex:0}],
  classes:[{id:1,name:'Class 11B',grade:11,code:'AB12CD',n:32,weak:'Patterns'},{id:2,name:'Class 12A',grade:12,code:'QW98ZX',n:28,weak:'Solve'}],
  joined:[{name:'Class 11B',code:'AB12CD'}],f:{topic:'All',level:'All',undone:false},defSel:null,thm:{},
  authorEx:[{t:'Find ∠OAB',topic:'Circle',lvl:'Medium',st:'Published',up:'Today'},{t:'Tangent and radius',topic:'Circle',lvl:'Easy',st:'Published',up:'Mon'},{t:'Cyclic quadrilateral',topic:'Circle',lvl:'Hard',st:'Draft',up:'Mar 3'},{t:'Same segment',topic:'Circle',lvl:'Medium',st:'In review',up:'Mar 1'}],
  authorTh:[{t:'Angle at the centre',topic:'Circle',n:14,st:'Published'},{t:'Tangent ⟂ radius',topic:'Circle',n:9,st:'Published'},{t:'Same segment',topic:'Circle',n:11,st:'Published'}],
  authorDef:[{t:'Chord',topic:'Circle',st:'Published'},{t:'Subtend',topic:'Circle',st:'Draft'}],
  checks:[1,1,1,0],live:{phase:'setup',joined:0,q:1,t:12,ans:[0,0,0,0],show:false},sort:{learners:'name'},heatView:'theorem',exSel:0,edSt:'Draft'}}
let S=freshState();

/* learners (teacher data) */
let seed=5;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
const NAMES=['Aisha','Ben','Carlos','Dineo','Elan','Fatima','Grace','Hamza'];
const LEARNERS=NAMES.map((n,i)=>{const st=[0,1,2,3].map(k=>{let v=Math.round(55+rnd()*40);if(k===2)v=Math.max(15,v-38);if(k===3)v=Math.max(15,v-22);if(i===4)v=Math.max(10,v-30);return v});
  const th=[0,1,2,3,4].map(k=>{let v=Math.round(25+rnd()*70);if(k>=2)v=Math.max(10,v-18);if(i===4)v=Math.max(8,v-35);return v});
  return{id:i+1,name:n,st,th,done:6+Math.round(rnd()*10),last:['Today','Today','Yesterday','Today','3 days ago','Today','2 days ago','Yesterday'][i],help:i===1||i===4}});
const STG=['Abstraction','Decomposition','Patterns','Solve'];
const hue=v=>`hsl(${Math.round(v*1.2)} 62% 66%)`;

/* ---------------- diagrams ---------------- */
const keys=ks=>{const s=$('#msvg');if(s)s.setAttribute('class','dia '+ks.map(k=>'on-'+k).join(' '))};
const hlCss=['centre','radii','ca','cb','tri','angC','angO','angA','angB','angT','angP','tan','radius'].map(k=>`.dia.on-${k} .k-${k}`).join(',');
(function(){const st=document.createElement('style');st.textContent=hlCss+'{opacity:1}';document.head.appendChild(st)})();

const ex1svg=()=>`<svg class="dia" id="msvg" viewBox="0 0 320 250" role="img" aria-label="Circle with centre O. Points A and B on the circle and C at the top. Lines OA, OB, CA, CB and AB are drawn.">
<circle class="c" cx="160" cy="140" r="100"/>
<path class="hlf k-tri" d="M160 140 L102.6 221.9 L217.4 221.9 Z"/>
<path class="hlf k-angC" d="M160 40 L147.96 78.16 A40 40 0 0 0 172.04 78.16 Z"/>
<path class="hlf k-angO" d="M160 140 L139.3 169.5 A36 36 0 0 0 180.7 169.5 Z"/>
<path class="hlf k-angA" d="M102.6 221.9 L122.1 194.1 A34 34 0 0 1 136.6 221.9 Z"/>
<path class="hlf k-angB" d="M217.4 221.9 L197.9 194.1 A34 34 0 0 0 183.4 221.9 Z"/>
<line class="hl k-radii" x1="160" y1="140" x2="102.6" y2="221.9"/><line class="hl k-radii" x1="160" y1="140" x2="217.4" y2="221.9"/>
<line class="hl k-ca" x1="160" y1="40" x2="102.6" y2="221.9"/><line class="hl k-cb" x1="160" y1="40" x2="217.4" y2="221.9"/>
<circle class="hl k-centre" cx="160" cy="140" r="12"/>
<path class="ln" d="M160 40 L102.6 221.9 M160 40 L217.4 221.9 M160 140 L102.6 221.9 M160 140 L217.4 221.9 M102.6 221.9 L217.4 221.9"/>
<circle cx="160" cy="140" r="3.5" fill="var(--ink)"/>
<text class="lbl" x="166" y="134">O</text><text class="lbl" x="154" y="30">C</text><text class="lbl" x="80" y="238">A</text><text class="lbl" x="224" y="238">B</text>
<text class="lbl" x="171" y="96" style="font-size:12px">35°</text></svg>`;
const ex2svg=()=>`<svg class="dia" id="msvg" viewBox="0 0 320 250" role="img" aria-label="Circle with centre O. T is on the circle at the bottom. A tangent line touches the circle at T. P is on the tangent. Lines OT and OP are drawn.">
<circle class="c" cx="160" cy="140" r="90"/>
<path class="hlf k-tri" d="M160 140 L160 230 L267.3 230 Z"/>
<path class="hlf k-angO" d="M160 140 L160 174 A34 34 0 0 0 186 161.9 Z"/>
<path class="hlf k-angT" d="M160 230 L160 212 L178 212 L178 230 Z"/>
<path class="hlf k-angP" d="M267.3 230 L231.3 230 A36 36 0 0 1 239.7 206.9 Z"/>
<line class="hl k-radius" x1="160" y1="140" x2="160" y2="230"/>
<line class="hl k-tan" x1="40" y1="230" x2="300" y2="230"/>
<circle class="hl k-centre" cx="160" cy="140" r="12"/>
<path class="ln" d="M40 230 L300 230 M160 140 L160 230 M160 140 L267.3 230"/>
<circle cx="160" cy="140" r="3.5" fill="var(--ink)"/>
<text class="lbl" x="168" y="134">O</text><text class="lbl" x="146" y="248">T</text><text class="lbl" x="272" y="248">P</text><text class="lbl" x="190" y="180" style="font-size:12px">50°</text></svg>`;
const mini=(inner,vb='0 0 320 270')=>`<svg class="mini" viewBox="${vb}" aria-hidden="true">${inner}</svg>`;
const C1='<circle class="c" cx="160" cy="140" r="100"/>',C2='<circle class="c" cx="160" cy="140" r="90"/>';

const EX={
1:{id:1,title:'Find ∠OAB',topic:'Circle geometry',level:'Medium',svg:ex1svg,

/* ---------------- theorem geometry ---------------- */
const pt=(phi,r)=>[160+r*Math.cos(phi*Math.PI/180),140-r*Math.sin(phi*Math.PI/180)];
function wedge(P,Q1,Q2,rad){const n=(a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[dx/l,dy/l]};
  const u1=n(P,Q1),u2=n(P,Q2),p1=[P[0]+rad*u1[0],P[1]+rad*u1[1]],p2=[P[0]+rad*u2[0],P[1]+rad*u2[1]];
  const sw=(u1[0]*u2[1]-u1[1]*u2[0])>0?1:0,m=[u1[0]+u2[0],u1[1]+u2[1]],ml=Math.hypot(m[0],m[1])||1;
  return{d:`M${P[0]} ${P[1]} L${p1[0]} ${p1[1]} A${rad} ${rad} 0 0 ${sw} ${p2[0]} ${p2[1]} Z`,lab:[P[0]+(rad+16)*m[0]/ml,P[1]+(rad+16)*m[1]/ml],ang:Math.acos(Math.max(-1,Math.min(1,u1[0]*u2[0]+u1[1]*u2[1])))*180/Math.PI}}
function thm1(r,th,cv,showA,showR){const O=[160,140],A=pt(270-th/2,r),B=pt(270+th/2,r),half=180-th/2-14,C=pt(90+(cv/100)*half,r);
  const wO=wedge(O,A,B,28),wC=wedge(C,A,B,24);
  let s=`<circle class="c" cx="160" cy="140" r="${r}"/>`;
  if(showA)s+=`<path class="ang" d="${wO.d}"/><path class="ang" d="${wC.d}"/><text class="lbl" style="font-size:12px" x="${wO.lab[0]-12}" y="${wO.lab[1]+4}">${Math.round(wO.ang)}°</text><text class="lbl" style="font-size:12px" x="${wC.lab[0]-12}" y="${wC.lab[1]+4}">${Math.round(wC.ang)}°</text>`;
  s+=`<path class="ln" d="M${A[0]} ${A[1]} L${B[0]} ${B[1]} M${C[0]} ${C[1]} L${A[0]} ${A[1]} M${C[0]} ${C[1]} L${B[0]} ${B[1]}${showR?` M160 140 L${A[0]} ${A[1]} M160 140 L${B[0]} ${B[1]}`:''}"/><circle cx="160" cy="140" r="3.5" fill="var(--ink)"/><text class="lbl" x="168" y="132">O</text>`;
  const lab=(P,t,dx,dy)=>`<circle cx="${P[0]}" cy="${P[1]}" r="3.5" fill="var(--ink)"/><text class="lbl" x="${P[0]+dx}" y="${P[1]+dy}">${t}</text>`;
  s+=lab(A,'A',-20,16)+lab(B,'B',8,16)+lab(C,'C',-4,-10);
  return{svg:s,read:`∠AOB = <b>${Math.round(wO.ang)}°</b> &nbsp; ∠ACB = <b>${wC.ang.toFixed(1)}°</b><br>∠AOB ÷ ∠ACB = <b>${(wO.ang/wC.ang).toFixed(2)}</b>`}}
function thm2(r,pos,d,showR){const O=[160,140],T=pt(pos,r),u=[(T[0]-O[0])/r,(T[1]-O[1])/r],tv=[-u[1],u[0]],P=[T[0]+tv[0]*d,T[1]+tv[1]*d],E1=[T[0]-tv[0]*120,T[1]-tv[1]*120],E2=[T[0]+tv[0]*120,T[1]+tv[1]*120];
  const w=wedge(T,O,P,18),ang=w.ang;
  let s=`<circle class="c" cx="160" cy="140" r="${r}"/><path class="ln" d="M${E1[0]} ${E1[1]} L${E2[0]} ${E2[1]} M160 140 L${T[0]} ${T[1]} M160 140 L${P[0]} ${P[1]}"/>`;
  if(showR){const a=[T[0]+u[0]*-14*-1*-1,T[1]];const q1=[T[0]-u[0]*14,T[1]-u[1]*14],q2=[T[0]+tv[0]*14,T[1]+tv[1]*14],q3=[q1[0]+tv[0]*14,q1[1]+tv[1]*14];
    s+=`<path class="ang" d="M${T[0]} ${T[1]} L${q1[0]} ${q1[1]} L${q3[0]} ${q3[1]} L${q2[0]} ${q2[1]} Z"/>`}
  s+=`<circle cx="160" cy="140" r="3.5" fill="var(--ink)"/><text class="lbl" x="166" y="130">O</text><circle cx="${T[0]}" cy="${T[1]}" r="3.5" fill="var(--ink)"/><text class="lbl" x="${T[0]+u[0]*14-4}" y="${T[1]+u[1]*16+4}">T</text><circle cx="${P[0]}" cy="${P[1]}" r="3.5" fill="var(--ink)"/><text class="lbl" x="${P[0]+tv[0]*10-4}" y="${P[1]+tv[1]*12+4}">P</text>`;
  return{svg:s,read:`Radius OT meets tangent PT at <b>${ang.toFixed(1)}°</b>.<br>It stays 90° wherever T is.`}}

  init(){let f='All',q='';const draw=()=>{$('#tb').innerHTML=L.map((r,i)=>[r,i]).filter(([r])=>(f==='All'||r.st===f)&&r.t.toLowerCase().includes(q)).map(([r,i])=>`<tr class="click" data-i="${i}">${cell(r).map((c,k)=>`<td>${c==='Published'?'<span class="pill ok">Published</span>':c==='Draft'||c==='In review'?`<span class="pill warn">${c}</span>`:c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="5" class="empty">Nothing matches.</td></tr>`;$$('#tb tr.click').forEach(t=>t.onclick=()=>go(`/author/${sec}/${t.dataset.i}`+(sec==='examples'?'/diagram':'')))};
   $$('#sf [data-s]').forEach(b=>b.onclick=()=>{f=b.dataset.s;$$('#sf [data-s]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});$('#sq').oninput=e=>{q=e.target.value.toLowerCase();draw()};draw();
   $('#new').onclick=()=>{const item=sec==='examples'?{t:'Untitled example',topic:'Circle',lvl:'Medium',st:'Draft',up:'Today'}:sec==='theorems'?{t:'Untitled theorem',topic:'Circle',n:0,st:'Draft'}:{t:'Untitled term',topic:'Circle',st:'Draft'};L.push(item);go(`/author/${sec}/${L.length-1}`+(sec==='examples'?'/diagram':''))}}}}
function edEx(i,tab){const ex=S.authorEx[i]||S.authorEx[0];const tb=[['diagram','Diagram'],['stages','Stages'],['steps','Steps'],['publish','Preview and publish']];
  const head=`<p><a href="#/author/examples">&larr; Examples</a></p><div class="row" style="border:0"><h2>${ex.t}</h2><span class="pill ${ex.st==='Published'?'ok':'warn'}">${ex.st}</span></div><nav class="tabs">${tb.map(([k,n])=>`<a href="#/author/examples/${i}/${k}" ${k===tab?'aria-current="page"':''}>${n}</a>`).join('')}</nav>`;let b='',init=null;
  if(tab==='diagram'){b=`<div class="grid2"><div class="card"><h3>Diagram data</h3><button class="btn sm ghost" id="imp">Import from GeoGebra</button><textarea id="js" style="margin-top:8px" aria-label="Diagram data">{\n "circle": {"center":"O","radius":100},\n "points": {"O":[0,0],"A":[-57,-82],"B":[57,-82],"C":[0,100]},\n "lines": [["O","A"],["O","B"],["C","A"],["C","B"],["A","B"]],\n "angles": [{"at":"C","from":"A","to":"B","label":"35°"}]\n}</textarea><p class="muted" id="val" style="margin:6px 0 0">Valid ✓ every line refers to existing points</p></div><div class="card"><h3>Live preview</h3>${ex1svg()}</div></div>`;
    init=()=>{$('#imp').onclick=()=>toast('In the real app: choose your GeoGebra export and it is converted to this format');$('#js').oninput=e=>{try{JSON.parse(e.target.value);$('#val').textContent='Valid ✓ every line refers to existing points'}catch(x){$('#val').textContent='Not valid yet: check commas and brackets'}}}}
  if(tab==='stages'){b=`<div class="grid2"><div class="card"><h3>1. Facts</h3>${EX[1].facts.map(f=>`<label class="row"><span>${f.t}</span><span class="muted"><input type="checkbox" ${f.need?'checked':''}> needed</span></label>`).join('')}<button class="btn sm ghost" data-t="Add fact">Add fact</button></div><div class="card"><h3>2. Sub-diagrams</h3>${EX[1].subs.map(s=>`<label class="row"><span style="width:50px">${s.inner}</span><span style="flex:1">${s.t}</span><span class="muted"><input type="checkbox" ${s.need?'checked':''}> used</span></label>`).join('')}</div></div><div class="card" style="margin-top:14px"><h3>3. Patterns</h3>${[['Angles at O and C',1],['Triangle OAB',2]].map(([n,a])=>`<div class="row"><span>${n}</span><select style="max-width:300px">${EX[1].pats.opts.slice(1).map((o,k)=>`<option ${k+1===a?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')}</div>`;
    init=()=>$$('[data-t]').forEach(x=>x.onclick=()=>toast(x.dataset.t+' (prototype)'))}
  if(tab==='steps'){b=`<div class="card scroll"><table class="tbl"><thead><tr><th>#</th><th>Statement</th><th>Reason</th><th>Highlight</th></tr></thead><tbody>${EX[1].proof.map((p,k)=>`<tr><td>${k+1}</td><td>${p.s||p.S[p.Sc]}</td><td>${p.r||p.R[p.Rc]}</td><td><code>${p.hl.join(', ')}</code></td></tr>`).join('')}</tbody></table></div><div class="card" style="margin-top:14px"><h3>Step 3: wrong options</h3><div class="grid2"><label class="f">Wrong statement<input type="text" value="∠OAB = ∠ACB"></label><label class="f">Wrong reason<input type="text" value="Angles in the same segment"></label></div><label class="f">Hint<input type="text" value="Look at triangle OAB. Which two sides did you prove equal in step 2?"></label></div>`}
  if(tab==='publish'){const ck=['Diagram valid','All four stages set','Steps have hints','Reviewed by a second author'];const all=()=>S.checks.every(Boolean);
    b=`<div class="grid2"><div class="card"><h3>Check list</h3>${ck.map((c,k)=>`<label class="row"><span>${c}</span><input type="checkbox" data-c="${k}" ${S.checks[k]?'checked':''}></label>`).join('')}</div><div class="card"><h3>Preview</h3><div style="max-width:220px">${thumb(1)}</div><div class="actions"><a class="btn ghost" href="#/examples/1">Open as learner</a><button class="btn ghost" id="sd">Save draft</button><button class="btn ghost" id="sr">Submit for review</button><button class="btn" id="pb">Publish</button></div><p class="muted" id="pm"></p></div></div>`;
    init=()=>{const upd=()=>{$('#pb').disabled=!all();$('#pm').textContent=all()?'Ready to publish.':'Publishing is blocked until every item is ticked.'};
      $$('[data-c]').forEach(c=>c.onchange=()=>{S.checks[+c.dataset.c]=c.checked?1:0;upd()});upd();
      $('#sd').onclick=()=>toast('Draft saved');$('#sr').onclick=()=>{ex.st='In review';toast('Submitted for review');render()};$('#pb').onclick=()=>{ex.st='Published';ex.up='Today';toast('Published. It now appears in Examples.');render()}}}
  return{html:head+b,init}}
function edTh(i){const t=S.authorTh[i]||S.authorTh[0];return{html:`<p><a href="#/author/theorems">&larr; Theorems</a></p><div class="row" style="border:0"><h2>Theorem editor</h2><button class="btn" id="sv">Save</button></div><div class="grid2"><div class="card"><label class="f">Name<input type="text" id="tn" value="${t.t}"></label><label class="f">Statement in plain words<textarea id="ts" style="font-family:var(--body);font-size:.95rem;min-height:70px">The angle at the centre is twice the angle at the circumference.</textarea></label><h3>Controls</h3><label class="row"><span>Angle toggle</span><input type="checkbox" checked></label><label class="row"><span>Radii toggle</span><input type="checkbox" checked></label><div class="row"><span>Slider: Radius</span><span class="muted">min 60, max 105</span></div><button class="btn sm ghost" data-t="Add slider">Add slider</button><label class="f" style="margin-top:10px">GeoGebra file ID (optional)<input type="text"></label></div><div class="card"><h3>Preview</h3><p id="pv" style="font-weight:700">${t.t}</p><p class="muted" id="pv2">The angle at the centre is twice the angle at the circumference.</p><svg class="dia" viewBox="0 0 320 270">${thm1(100,70,0,true,true).svg}</svg></div></div>`,
  init(){$('#tn').oninput=e=>{$('#pv').textContent=e.target.value};$('#ts').oninput=e=>{$('#pv2').textContent=e.target.value};$('#sv').onclick=()=>{t.t=$('#tn').value||t.t;toast('Theorem saved')};$$('[data-t]').forEach(x=>x.onclick=()=>toast('Add slider (prototype)'))}}}
function edDef(i){const d=S.authorDef[i]||S.authorDef[0];return{html:`<p><a href="#/author/definitions">&larr; Definitions</a></p><div class="row" style="border:0"><h2>Definition editor</h2><button class="btn" id="sv">Save</button></div><div class="grid2"><div class="card"><label class="f">Term<input type="text" id="dt" value="${d.t}"></label><label class="f">Definition<textarea id="dd" style="font-family:var(--body);font-size:.95rem;min-height:80px">A straight line joining two points on the circle.</textarea></label><label class="f">Topic<select><option>Circle</option><option>Triangles</option></select></label><label class="f">Related theorems<select><option>Same segment</option><option>Angle at the centre</option></select></label></div><div class="card"><h3>Preview card</h3><div style="max-width:220px">${mini(CB+'<path class="em" d="M31.8 50.3 L83 20.7"/>','0 0 120 80')}<h3 id="pt">${d.t}</h3><p class="muted" id="pd">A straight line joining two points on the circle.</p></div></div></div>`,
  init(){$('#dt').oninput=e=>{$('#pt').textContent=e.target.value};$('#dd').oninput=e=>{$('#pd').textContent=e.target.value};$('#sv').onclick=()=>{d.t=$('#dt').value||d.t;toast('Definition saved')}}}}

syncRole();render();
})();
</script>
