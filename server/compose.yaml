services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: GeoPath
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - geop-path-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d GeoPath"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  geop-path-postgres-data:
